<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4e89">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mobil Teklif">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>BY5 Mobil Teklif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: tek sütun mobil uygulama kabuğu — yapışkan üst bar, kaydırılan içerik, sabit alt sekme çubuğu */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --surface-2:#e6eaf2; --ink:#15212a; --muted:#5a6870;
  --line:#d2d8d7; --steel:#1d4e89; --steel-ink:#ffffff; --amber:#ffb703; --amber-ink:#1c1405;
  --hero:linear-gradient(120deg,#1d4e89 0%,#2a6fdb 55%,#7b3fe4 100%);
  --danger:#b3261e; --ok:#2b7a4b; --shadow:0 1px 2px rgba(21,33,42,.08),0 4px 14px rgba(21,33,42,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --tabh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#18232a; --surface-2:#213039; --ink:#e6ecee; --muted:#93a4ad;
  --line:#2b3a44; --steel:#2f66b0; --steel-ink:#ffffff; --amber:#ffc23d; --amber-ink:#1c1405; --hero:linear-gradient(120deg,#163d6c 0%,#2257b0 55%,#5a2fb0 100%);
  --danger:#ef6b62; --ok:#5cc28a; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#18232a; --surface-2:#213039; --ink:#e6ecee; --muted:#93a4ad;
  --line:#2b3a44; --steel:#2f66b0; --steel-ink:#ffffff; --amber:#ffc23d; --amber-ink:#1c1405; --hero:linear-gradient(120deg,#163d6c 0%,#2257b0 55%,#5a2fb0 100%);
  --danger:#ef6b62; --ok:#5cc28a; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:600px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px)}

/* Üst bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--gc,var(--hero));transition:background .25s;color:var(--steel-ink);padding:12px 16px 14px}
.top-row{display:flex;align-items:center;gap:10px;min-height:36px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.top .sub{font-size:12px;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.iconbtn{width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:inherit;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.search{margin-top:10px;position:relative}
.search input{width:100%;height:44px;border-radius:10px;border:0;padding:0 14px 0 40px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--muted)}
/* hazard strip under top bar: the one decorative flourish */
.strip{height:5px;background:repeating-linear-gradient(-45deg,var(--amber) 0 10px,var(--ink) 10px 20px);opacity:.9}

.view{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
.muted{color:var(--muted)}

/* Grup kartları */
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:480px){.groups{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gtile{--g:#1c7ed6;background:var(--g);color:#fff;border:0;border-radius:14px;padding:0;text-align:left;display:grid;grid-template-rows:auto auto;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.12),var(--shadow)}
.gmedia{aspect-ratio:4/3;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.28),transparent 45%),linear-gradient(150deg,rgba(255,255,255,.12),rgba(0,0,0,.18)),var(--g)}
.gmedia img{width:100%;height:100%;object-fit:cover;display:block}
.gmono{font-family:var(--f-display);font-weight:700;font-size:48px;letter-spacing:.02em;color:rgba(255,255,255,.92);text-shadow:0 2px 0 rgba(0,0,0,.15)}
.gcount{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.35);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;backdrop-filter:blur(4px)}
.glabel{padding:9px 11px 11px;display:grid;gap:2px}
.gtile:active{transform:scale(.98)}
.plate{width:42px;height:42px;border-radius:8px;background:var(--steel);color:var(--steel-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.03em;position:relative}
.plate::after{content:"";position:absolute;inset:3px;border:1px dashed rgba(255,255,255,.35);border-radius:6px}
.gname{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;word-break:break-word}
.gmeta{font-size:12px;opacity:.9}

/* Ürün listesi */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.prow:first-child{border-top:0}
.prow .info{flex:1;min-width:0}
.prow .dot{width:10px;height:10px;border-radius:50%;background:var(--g);flex:none}
.prow .pname{font-weight:600;line-height:1.25;word-break:break-word}
.prow .pmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.price{font-family:var(--f-display);font-weight:700;font-size:19px;white-space:nowrap}
.incart{display:inline-block;background:var(--amber);color:var(--amber-ink);font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.addbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--g,var(--amber));color:#fff;display:grid;place-items:center;flex:none}
.addbtn svg{width:20px;height:20px}

/* Sekmeler */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{border:0;background:none;display:grid;place-items:center;align-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--steel)}
:root[data-theme="dark"] .tab[aria-current="page"]{color:var(--amber)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--hero)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-current="page"]{color:var(--amber)}}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--amber);color:var(--amber-ink);font-size:11px;font-weight:700;display:grid;place-items:center}

/* Form öğeleri */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.card h2{color:var(--steel);font-family:var(--f-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:0}
.field{display:grid;gap:4px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 12px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:64px;padding:10px 12px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--steel)}
.btn{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.steel{background:#2a6fdb;border-color:#2a6fdb;color:#fff}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{font-size:13px;color:var(--muted)}

/* Sepet satırları */
.cline{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.cline:first-child{border-top:0}
.cline .top2{display:flex;gap:10px;align-items:flex-start}
.cline .pname{flex:1;min-width:0;font-weight:600;word-break:break-word}
.del{border:0;background:none;color:var(--muted);width:32px;height:32px;display:grid;place-items:center;flex:none;margin:-6px -6px 0 0}
.del svg{width:19px;height:19px}
.cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:end}
.cline .lt{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;height:40px;background:var(--bg)}
.stepper button{width:38px;height:100%;border:0;background:none;font-size:20px;font-weight:600}
.stepper input{width:58px;height:100%;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;background:var(--surface);font-weight:700;min-width:0}
.mini label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.mini .inp{height:40px;text-align:right}
.ltotal{text-align:right}
.ltotal .price{font-size:18px}
.sum{display:grid;gap:6px}
.sum .r{display:flex;justify-content:space-between;gap:12px}
.sum .grand{color:var(--steel);border-top:2px solid var(--steel);padding-top:8px;margin-top:2px;font-family:var(--f-display);font-weight:700;font-size:24px}
.inline-inp{width:72px;height:34px;text-align:right}
.empty{text-align:center;padding:36px 16px;display:grid;gap:10px;justify-items:center}
.empty svg{width:48px;height:48px;color:var(--muted)}

/* Alt sayfa (ürün detayı / önizleme) */
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:18px 18px 0 0;max-height:92%;overflow:auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;margin:0;text-transform:uppercase}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);padding:3px 9px;border-radius:99px}
.specs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;background:var(--bg);border-radius:10px;padding:12px}
.specs dt{color:var(--muted)}
.specs dd{margin:0;font-weight:600;word-break:break-word;text-align:right}
.bigqty{display:flex;align-items:center;gap:10px}
.bigqty .stepper{height:52px;flex:1}
.bigqty .stepper button{width:56px;font-size:26px}
.bigqty .stepper input{flex:1;width:0;min-width:0;font-size:22px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13.5px}
.linebox{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px}

/* Teklif önizleme kâğıdı */
.paper{background:#fff;color:#1b2329;border-radius:6px;padding:16px;font-size:12px;box-shadow:0 0 0 1px #d6dbdb}
.paper .ph{display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid #23475e;padding-bottom:8px;margin-bottom:10px}
.paper .ph b{font-size:14px}
.paper table{width:100%;border-collapse:collapse}
.paper th{background:#23475e;color:#fff;text-align:left;padding:5px;font-size:11px}
.paper td{padding:5px;border-bottom:1px solid #e3e6e6;vertical-align:top}
.paper .r{text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto}

/* Teklif geçmişi */
.orow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.orow:first-child{border-top:0}
.orow .info{flex:1;min-width:0}
.ono{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.02em}

.gset{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.gset:first-of-type{border-top:0}
.gthumb{width:52px;height:40px;border-radius:8px;background:var(--g);flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700}
.gthumb img{width:100%;height:100%;object-fit:cover}
.gset .nm{flex:1;min-width:0;font-weight:600;word-break:break-word}
.gset .btn{height:36px;padding:0 10px;font-size:13.5px}
.stk{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.stk::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.stk.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.stk.low{background:color-mix(in srgb,#f08c00 18%,transparent);color:#c26a00}
.stk.no{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.stockbox{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:10px;padding:10px 12px;font-weight:600}
.stockbox.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.stockbox.low{background:color-mix(in srgb,#f08c00 15%,transparent);color:#c26a00}
.stockbox.no{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.stockbox b{font-family:var(--f-display);font-size:24px}
.warn{font-size:13px;font-weight:600;color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.crumb{display:flex;align-items:center;gap:8px}
.sharebox{display:grid;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.copyline{display:flex;gap:8px;align-items:center}
.copyline code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px;user-select:all}
</style>

<div class="app" id="app">
  <header class="top" id="top">
    <div class="top-row">
      <button class="iconbtn" id="backBtn" hidden aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div style="flex:1;min-width:0">
        <div class="sub" id="topSub">Teklif Kataloğu</div>
        <h1 id="topTitle">Mobil Teklif</h1>
      </div>
      <button class="iconbtn" id="syncBtn" aria-label="Fiyatları güncelle" title="Fiyatları güncelle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8"/><path d="M21 4v5h-5M3 20v-5h5"/></svg></button>
    </div>
    <div class="search" id="searchWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Malzeme ara… (örn. sac 3 lük)" autocomplete="off">
    </div>
  </header>
  <div class="strip"></div>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Ana menü"><div class="tabs-in">
  <button class="tab" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>Katalog</button>
  <button class="tab" data-tab="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 11h11l2-8H6.3"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Sepet<span class="badge" id="cartBadge" hidden>0</span></button>
  <button class="tab" data-tab="offers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg>Teklifler</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Ayarlar</button>
</div></nav>

<div id="sheetHost"></div>
<input id="gfile" type="file" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script>
"use strict";
/* ---------- Örnek veri: MALZEMELER.xlsx (ad, satış fiyatı, grup) ---------- */
const SEED = [];
const SEED_DATE = "2026-10-09";

/* ---------- Yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tl = s => String(s ?? "").toLocaleLowerCase("tr");
const tu = s => String(s ?? "").toLocaleUpperCase("tr");
const NF2 = new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const NFQ = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:3});
const money = n => NF2.format(Math.round((n||0)*100)/100) + " ₺";
const qtyf = n => NFQ.format(n||0);
function num(v){
  if (typeof v === "number") return v;
  if (v == null) return NaN;
  let s = String(v).trim().replace(/₺|TL|\s/gi,"");
  if (!s) return NaN;

function resizeImage(file, max){
  return new Promise((res,rej)=>{
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = ()=>{ const k = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", .82)); };
    img.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error("Resim okunamadı")); };
    img.src = u;
  });
}

function calc(lines, disc, vat, incl){
  const sub = lines.reduce((a,l)=>a + l.qty*l.price, 0);
  const d = sub*(disc||0)/100, net = sub-d;
  let base, v, total;
  if (incl){ total=net; base=net/(1+vat/100); v=total-base; } else { base=net; v=net*vat/100; total=net+v; }
  return {sub, d, net, base, v, total};
}

function addToCart(p, qty){

function pdfBlob(o){
  return new Promise((res,rej)=>{
    if (!window.pdfMake){ rej(new Error("PDF kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edin.")); return; }
    try{ pdfMake.createPdf(pdfDoc(o)).getBlob(b=>res(b)); }catch(e){ rej(e); }
  });
}
const fileName = o => `Teklif_${o.no}${o.customer&&o.customer.name?"_"+o.customer.name.replace(/[^\p{L}\p{N}]+/gu,"_").slice(0,30):""}.pdf`;

function waNumber(p){
  let d = String(p||"").replace(/\D/g,"");
  if (!d) return "";
  if (d.startsWith("00")) d = d.slice(2);
  if (d.startsWith("0")) d = "90"+d.slice(1);
  else if (d.length===10 && d.startsWith("5")) d = "90"+d;
  return d;
}
function shareText(o){
  const c = o.customer||{};
  return `${c.name?"Sayın "+c.name+",\n":""}${o.no} numaralı fiyat teklifimiz ektedir.\n${o.lines.length} kalem · Genel toplam: ${money(o.total)} (KDV dahil)\n\n${settings.company}${settings.phone?"\n"+settings.phone:""}`;
}
async function savePdf(blob, name){
  if (dlCap){
    try{ await dlCap.save({filename:name, data:blob}); return "saved"; }
    catch(e){ if (e && e.code==="declined") return "declined"; }
  }
  try{
    const u = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 4000); return "saved";
  }catch(e){ return "failed"; }
}
async function sendOffer(kind, o){
  o = o || ensureOffer();
  if (!o.lines.length){ toast("Sepet boş"); return; }
  let blob;
  try{ blob = await pdfBlob(o); }catch(e){ toast(e.message||"PDF oluşturulamadı"); return; }
  const name = fileName(o);
  if (kind==="pdf"){ const r = await savePdf(blob,name); if (r==="saved") toast("PDF kaydedildi"); render(); return; }
  const file = new File([blob], name, {type:"application/pdf"});
  // 1) Telefonun paylaş menüsü: PDF doğrudan WhatsApp / Mail'e eklenir
  try{
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Fiyat Teklifi "+o.no, text: kind==="mail" ? shareText(o) : undefined});
      toast("Paylaşım açıldı"); render(); return;
    }
  }catch(e){ if (e && e.name==="AbortError"){ return; } }
  // 2) Yedek yol: PDF'i kaydet, sonra WhatsApp / e-posta bağlantısını aç
  const r = await savePdf(blob, name);
  openShareSheet(kind, o, r==="saved");
  render();
}

function findCol(headers, pats, not){
  for (const p of pats){ const i = headers.findIndex((h,ix)=>p.test(h) && !(not&&not.test(h))); if (i>=0) return i; }
  return -1;
}
function parseSheet(rows){
  const norm = h => tu(String(h??"").trim()).replace(/\s+/g," ");
  let hi = rows.findIndex(r => r && r.some(c => /MALZEME|ÜRÜN|STOK ADI/.test(norm(c))));
  if (hi < 0) throw new Error("Başlık satırı bulunamadı (MALZEME ADI sütunu yok).");
  const H = rows[hi].map(norm);
  const ci = {
    name: findCol(H,[/^MALZEME ADI$/,/^ÜRÜN ADI$/,/^STOK ADI$/,/MALZEME ADI|ÜRÜN ADI/,/^MALZEME$/,/^ÜRÜN$/]),
    price: findCol(H,[/SATIŞ FİYAT/,/SATIS FIYAT/,/^SATIŞ/,/^FİYAT$/,/FİYAT/],/ALIŞ|ALIS/),
    cost: findCol(H,[/ALIŞ FİYAT/,/ALIS FIYAT/,/^ALIŞ/,/MALİYET/]),
    group: findCol(H,[/^GRUP KODU$/,/GRUP/,/KATEGORİ/]),
    unit: findCol(H,[/^BİRİM$/,/^BİRİMİ$/,/^BİRİM ADI$/,/^BIRIM$/]),
    code: findCol(H,[/STOK KODU/,/MALZEME KODU/,/ÜRÜN KODU/,/^KOD$/],/GRUP/),
    img: findCol(H,[/RESİM/,/GÖRSEL/,/FOTO/,/^IMG|^IMAGE/]),
    stock: findCol(H,[/AMBAR/,/STOK DURUM/,/STOK MİKTAR/,/MEVCUT/,/ENVANTER/,/ELDEKİ/,/^STOK$/,/^MİKTAR$/])
  };
  if (ci.name<0) throw new Error("MALZEME ADI sütunu bulunamadı.");
  if (ci.price<0) throw new Error("SATIŞ FİYATI sütunu bulunamadı.");
  const used = new Set(Object.values(ci).filter(i=>i>=0));
  const out = [];
  for (let r = hi+1; r < rows.length; r++){
    const row = rows[r]; if (!row) continue;
    const name = String(row[ci.name]??"").trim(); if (!name) continue;
    const price = num(row[ci.price]);
    const extra = {};
    H.forEach((h,i)=>{ if (!used.has(i) && h && row[i]!=null && String(row[i]).trim()!=="") extra[String(rows[hi][i]).trim()] = typeof row[i]==="number" ? qtyf(row[i]) : String(row[i]).trim(); });
    out.push({id:"p"+out.length, name, price:isNaN(price)?0:Math.round(price*100)/100,
      cost: ci.cost>=0 && !isNaN(num(row[ci.cost])) ? num(row[ci.cost]) : null,
      group: ci.group>=0 && String(row[ci.group]??"").trim() ? tu(String(row[ci.group]).trim()) : "DİĞER",
      unit: ci.unit>=0 && row[ci.unit] ? tu(String(row[ci.unit]).trim()) : "ADET",
      code: ci.code>=0 && row[ci.code]!=null ? String(row[ci.code]).trim() : "",
      stock: ci.stock>=0 && row[ci.stock]!=null && String(row[ci.stock]).trim()!=="" && !isNaN(num(row[ci.stock])) ? num(row[ci.stock]) : (ci.stock>=0 ? 0 : null),
      img: ci.img>=0 && /^https?:\/\//.test(String(row[ci.img]??"")) ? String(row[ci.img]).trim() : "",
      extra});
  }
  if (!out.length) throw new Error("Listede ürün satırı bulunamadı.");
  return out;
}
function importBuffer(buf, source){
  if (!window.XLSX) throw new Error("Excel okuyucu yüklenemedi. İnternet bağlantısını kontrol edin.");
  const wb = XLSX.read(buf, {type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  const list = parseSheet(rows);
  // sepetteki ürün kimliklerini isimle eşleştir
  const byName = new Map(list.map(p=>[tl(p.name), p]));
  cart.forEach(l=>{ const p = byName.get(tl(l.name)); if (p){ l.id = p.id; } else { l.id = "x_"+l.id; } });
  products = list;
  meta = {...meta, source, updated:new Date().toISOString(), hasCost:list.some(p=>p.cost>0), hasStock:list.some(p=>p.stock!=null)};
  LS.set("products", products); LS.set("meta", meta); saveAll();
  return list.length;
}
function oneDriveUrl(link){
  const u = link.trim();
  if (/sharepoint\.com/i.test(u)) return u + (u.includes("?")?"&":"?") + "download=1";
  if (/1drv\.ms|onedrive\.live\.com/i.test(u)){
    const b64 = btoa(unescape(encodeURIComponent(u))).replace(/=+$/,"").replace(/\//g,"_").replace(/\+/g,"-");
    return "https://api.onedrive.com/v1.0/shares/u!"+b64+"/root/content";
  }
  return u;
}
async function syncFromLink(){
  const link = (meta.link||"").trim();
  if (!link){ toast("Önce Ayarlar'a OneDrive bağlantısını girin"); return; }
  toast("OneDrive'dan indiriliyor…", 6000);
  try{
    const r = await fetch(oneDriveUrl(link));
    if (!r.ok) throw new Error("HTTP "+r.status);
    const n = importBuffer(new Uint8Array(await r.arrayBuffer()), "OneDrive bağlantısı");
    render(); toast(n+" malzeme güncellendi");
  }catch(e){
    toast("Bağlantıdan alınamadı. Ayarlar → Excel dosyası seç ile OneDrive'dan seçin.", 5000);
  }
}

/* ---------- Gezinme ---------- */
function go(tab){ route = {tab, group:null}; query = ""; $("#q").value = ""; closeSheet(); render(); window.scrollTo(0,0); pushNav(); }
const STANDALONE = (()=>{ try{ return window.top===window; }catch(e){ return false; } })();
function pushNav(){ if (!STANDALONE) return; try{ history.pushState({m:1}, ""); }catch(e){} }
window.addEventListener("popstate", ()=>{
  if ($("#sheetHost").innerHTML){ closeSheet(); return; }
  if (route.tab==="home" && route.group){ route.group=null; render(); return; }
  if (route.tab!=="home"){ route={tab:"home",group:null}; render(); }
});
$("#backBtn").onclick = ()=>{ route.group=null; query=""; $("#q").value=""; render(); window.scrollTo(0,0); };
$("#syncBtn").onclick = syncFromLink;
document.querySelectorAll(".tab").forEach(t => t.onclick = ()=>go(t.dataset.tab));
let qT; $("#q").addEventListener("input", e=>{ clearTimeout(qT); qT = setTimeout(()=>{ query = e.target.value.trim(); render(); }, 120); });

$("#gfile").addEventListener("change", async e=>{
  const f = e.target.files[0]; if (!f || !pendingGroup) return;
  try{
    gimg[pendingGroup] = await resizeImage(f, 640);
    try{ localStorage.setItem("mt_gimg", JSON.stringify(gimg)); }
    catch(err){ delete gimg[pendingGroup]; toast("Cihaz hafızası doldu; başka bir grubun resmini kaldırın", 4000); return; }
    render(); toast(pendingGroup+" resmi eklendi");
  }catch(err){ toast(err.message||"Resim okunamadı"); }
  pendingGroup = null;
});
let toastT;
function toast(msg, ms){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden=true, ms||2200); }

/* ---------- Olaylar (delegasyon) ---------- */
const main = $("#main");
main.addEventListener("click", async e=>{
  const gp = e.target.closest("[data-gpick]"); if (gp){ pickGroupImage(gp.dataset.gpick); return; }
  const gd = e.target.closest("[data-gdel]"); if (gd){ delete gimg[gd.dataset.gdel]; LS.set("gimg", gimg); render(); toast("Resim kaldırıldı"); return; }
  const g = e.target.closest("[data-group]"); if (g){ route.group = g.dataset.group; render(); window.scrollTo(0,0); pushNav(); return; }
  const pr = e.target.closest("[data-prod]"); if (pr){ openProduct(pr.dataset.prod); return; }
  const tg = e.target.closest("[data-tab-go]"); if (tg){ go(tg.dataset.tabGo); return; }
  const off = e.target.closest("[data-offer]"); if (off){ openOffer(+off.dataset.offer); return; }
  const st = e.target.closest("[data-step]");
  if (st){ const i = +st.dataset.step, l = cart[i]; l.qty = Math.max(0, Math.round((l.qty + (+st.dataset.d))*1000)/1000);
    if (l.qty===0){ cart.splice(i,1); saveAll(); render(); return; }
    $("#q_"+i).value = qtyf(l.qty); saveAll(); refreshTotals(); return; }
  const dl = e.target.closest("[data-del]"); if (dl){ const l = cart.splice(+dl.dataset.del,1)[0]; saveAll(); render(); toast(l.name+" çıkarıldı"); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act==="wa"||act==="mail"||act==="pdf"){ a.disabled = true; try{ await sendOffer(act); } finally { a.disabled = false; } }
  else if (act==="preview") previewOffer(ensureOffer());
  else if (act==="saveOffer"){ const o = ensureOffer(); render(); toast(o.no+" kaydedildi"); }
  else if (act==="clear"){
    if (a.dataset.armed){ cart=[]; customer={name:"",phone:"",email:"",note:""}; currentNo=""; settings.discount=0; saveAll(); render(); toast("Sepet temizlendi"); }
    else { a.dataset.armed = "1"; a.textContent = "Emin misiniz? Tekrar dokunun"; setTimeout(()=>{ if(a.isConnected){ delete a.dataset.armed; a.textContent="Sepeti temizle"; } }, 3000); }
  }
});
main.addEventListener("keydown", e=>{ if (e.key==="Enter" && e.target.matches(".prow")) openProduct(e.target.dataset.prod); });
main.addEventListener("input", e=>{
  const el = e.target;
  if (el.dataset.qty!=null){ const v = num(el.value); if (v>0){ cart[+el.dataset.qty].qty = v; saveAll(); refreshTotals(); } return; }
  if (el.dataset.price!=null){ const v = num(el.value); if (v>=0){ cart[+el.dataset.price].price = v; saveAll(); refreshTotals(); } return; }
  if (el.id==="disc"){ const v = num(el.value); settings.discount = isNaN(v)?0:Math.min(100,Math.max(0,v)); saveAll(); refreshTotals(); return; }
  if (el.dataset.cust){ customer[el.dataset.cust] = el.value; saveAll(); return; }
  if (el.dataset.set){ const k = el.dataset.set;
    settings[k] = el.type==="checkbox" ? el.checked : (el.dataset.num ? (isNaN(num(el.value))?0:num(el.value)) : el.value);
    saveAll(); return; }
  if (el.id==="s_link"){ meta.link = el.value.trim(); LS.set("meta", meta); }
});
main.addEventListener("change", async e=>{
  const el = e.target;
  if (el.dataset.qty!=null || el.dataset.price!=null){ render(); return; }
  if (el.dataset.set && el.type==="checkbox"){ settings[el.dataset.set] = el.checked; saveAll(); return; }
  if (el.id==="xfile" && el.files[0]){
    const f = el.files[0];
    try{ const n = importBuffer(new Uint8Array(await f.arrayBuffer()), f.name); render(); toast(n+" malzeme yüklendi"); }
    catch(err){ toast(err.message||"Dosya okunamadı", 5000); }
    el.value = ""; return;
  }
  if (el.id==="s_logo" && el.files[0]){
    const f = el.files[0]; const r = new FileReader();
    r.onload = ()=>{ settings.logo = r.result; saveAll(); render(); toast("Logo eklendi"); };
    r.readAsDataURL(f); return;
  }
});
main.addEventListener("click", e=>{
  if (e.target.id==="linkSync"){ meta.link = ($("#s_link").value||"").trim(); LS.set("meta",meta); syncFromLink(); }
  if (e.target.id==="seedReset"){ products = seedProducts(); meta = {...meta, source:"Örnek veri · MALZEMELER.xlsx", updated:SEED_DATE, hasCost:false}; LS.set("products",null); LS.set("meta",meta); render(); toast("Örnek liste yüklendi"); }
  if (e.target.id==="logoDel"){ settings.logo=""; saveAll(); render(); }
});
document.addEventListener("click", async e=>{
  const c = e.target.closest("[data-copy]"); if (!c) return;
  try{ await navigator.clipboard.writeText(c.dataset.copy); toast("Kopyalandı"); }
  catch(err){ const code = c.parentElement.querySelector("code") || c.previousElementSibling; if (code){ const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Metni seçip kopyalayın"); }
});

render();
if ("serviceWorker" in navigator && STANDALONE && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
